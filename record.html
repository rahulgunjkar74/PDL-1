<!DOCTYPE html>
<html>

<head>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-4">

<h2 class="text-center text-primary">Patient Records</h2>

<table class="table table-bordered">

<tr>

<th>Name</th>
<th>Age</th>
<th>BP</th>
<th>Sugar</th>
<th>Cholesterol</th>

</tr>

{% for row in patients[1:] %}

<tr>

{% for col in row %}

<td>{{col}}</td>

{% endfor %}

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
